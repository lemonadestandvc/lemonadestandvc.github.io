<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vool ära!</title>
<meta name="description" content="Mäng ühest väga pimedast nädalavahetusest. Sinu pere, sinu kodu, 62 tundi ilma elektrita.">
<meta property="og:title" content="Vool ära!">
<meta property="og:description" content="Torm, sinu pere ja 62 tundi pimedust. Kaheksa otsust, umbes kuus minutit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column read by torchlight. Amber light on night blue,
   a glow behind the story that follows the phone battery. Single dark theme by choice. */
:root{
  --ink:#0c111f; --ink-2:#141b30; --ink-3:#1e2848; --line:#2b3659;
  --text:#f3ebd9; --muted:#a8b4d2; --lamp:#ffb347; --lamp-2:#ffd08a; --ember:#ff7b5f;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --glow:.5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);min-height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font:400 18px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 50% at 50% 22%,rgba(255,179,71,calc(var(--glow)*.20)),transparent 72%)}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 18px 72px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lamp-2);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
a{color:var(--lamp-2)}

.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px}
.brand{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--lamp);white-space:nowrap;flex:none}
.top{gap:14px}
.top .fam{font-size:13px;color:var(--muted);text-align:right}

/* HUD */
.hud{position:sticky;top:0;z-index:5;padding:8px 0 10px;background:linear-gradient(var(--ink) 82%,rgba(12,17,31,0))}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}
.m{min-width:0}
.ml{display:flex;align-items:center;gap:6px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.ml svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar{height:7px;background:var(--ink-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lamp);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.m.low .ml{color:var(--ember)}
.m.low .bar i{background:repeating-linear-gradient(135deg,var(--ember) 0 5px,#ffb09e 5px 10px)}
.clock{margin-top:10px;display:flex;align-items:center;gap:10px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.track{position:relative;flex:1;height:2px;background:var(--line)}
.track i{position:absolute;left:0;top:0;height:2px;background:var(--lamp);transition:width .7s}
.track b{position:absolute;top:-4px;width:2px;height:10px;background:var(--line)}
.track b.on{background:var(--lamp)}

.kicker{font:700 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.lead{color:var(--muted);font-size:19px;max-width:34em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border-radius:12px;border:2px solid var(--lamp);background:var(--lamp);color:#1b1305;font:700 17px var(--body);text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:var(--lamp-2);border-color:var(--lamp-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:transparent;color:var(--muted);border-color:var(--line);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--lamp);background:rgba(255,179,71,.08)}

.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(68px,22vw,128px);line-height:.88;font-weight:800;letter-spacing:-.02em;margin:14px 0 18px}
.hero h1 .flick{display:inline-block;color:var(--lamp);animation:flick 5.5s infinite}
@keyframes flick{0%,86%,100%{opacity:1}87%{opacity:.25}88%{opacity:1}90%{opacity:.4}91%{opacity:1}93%{opacity:.15}94%{opacity:1}}
.meta{margin-top:26px;color:var(--muted);font-size:15px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

/* setup */
.setup h2{font-size:34px;line-height:1.05;margin:22px 0 6px}
.setup h3{font-size:21px;margin:30px 0 10px}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink-2)}
.row .lbl strong{display:block;font-weight:700;line-height:1.2}
.row .lbl span{display:block;color:var(--muted);font-size:14px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink);font:700 20px var(--body);line-height:1}
.step button:hover:not([disabled]){border-color:var(--lamp)}
.step button[disabled]{opacity:.35;cursor:not-allowed}
.step output{min-width:28px;text-align:center;font:800 22px var(--display);color:var(--lamp);font-variant-numeric:tabular-nums}
.seg{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:22px 1fr;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink-2)}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);margin-top:2px}
.choice[aria-pressed=true]{border-color:var(--lamp);background:rgba(255,179,71,.09)}
.choice[aria-pressed=true] .dot{border:6px solid var(--lamp)}
.choice strong{display:block;line-height:1.25}
.choice span.s{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--ink-2);font-weight:700}
.tog[aria-pressed=true]{background:var(--lamp);color:#1b1305;border-color:var(--lamp)}
.sum{margin-top:22px;padding:12px 14px;border-left:3px solid var(--lamp);color:var(--muted);font-size:16px}
.sum b{color:var(--text)}

/* prep */
.when{display:flex;align-items:baseline;gap:12px;margin:22px 0 4px;flex-wrap:wrap}
.when .t{font:800 40px/1 var(--display);color:var(--lamp);font-variant-numeric:tabular-nums}
.when .d{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2.st{font-size:34px;line-height:1.05;margin:4px 0 14px}
h2:focus,h2:focus-visible{outline:none}
.story p{margin:0 0 14px}
.home{border-left:3px solid var(--line);padding:2px 0 2px 14px;color:var(--muted);font-size:16px;margin:16px 0 20px}
.picks{display:grid;grid-template-columns:1fr;gap:8px;margin:0;padding:0;list-style:none}
.pick{display:grid;grid-template-columns:26px 1fr;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink-2);transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--muted)}
.pick .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-top:2px;display:grid;place-items:center}
.pick[aria-pressed=true]{border-color:var(--lamp);background:rgba(255,179,71,.09)}
.pick[aria-pressed=true] .box{background:var(--lamp);border-color:var(--lamp)}
.pick[aria-pressed=true] .box::after{content:"";width:6px;height:11px;border:solid #1b1305;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pick[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.pick strong{display:block;font-weight:700;line-height:1.25}
.pick span.s{display:block;color:var(--muted);font-size:15px;line-height:1.35;margin-top:2px}
.pick .new{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink-3);color:var(--lamp-2);vertical-align:2px}
.counter{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;font:700 15px var(--body);color:var(--muted)}
.counter b{color:var(--lamp);font-size:22px;font-variant-numeric:tabular-nums}

/* scene */
.drift{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px;font-size:14px;color:var(--muted)}
.dc{display:inline-flex;gap:5px;padding:1px 9px;border-radius:999px;border:1px solid;font:700 13px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc.up{color:var(--lamp);border-color:rgba(255,179,71,.5)}
.dc.dn{color:var(--ember);border-color:rgba(255,123,95,.5)}
.opts{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink-2);transition:border-color .15s,transform .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--lamp);background:rgba(255,179,71,.07);transform:translateX(3px)}
.opt .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:700 13px var(--body);color:var(--muted);margin-top:1px}
.opt[disabled]{border-style:dashed;background:transparent;color:var(--muted);cursor:not-allowed}
.opt .lock{display:block;font-size:14px;color:var(--ember);margin-top:3px}
.res{border-left:3px solid var(--lamp);padding:2px 0 2px 16px;margin:20px 0 0}
.res .you{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.res p{margin:0 0 12px}
.res .more::before{content:"+ ";color:var(--lamp);font-weight:700}
.res .less::before{content:"- ";color:var(--ember);font-weight:700}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tip{display:block;margin:16px 0 4px;padding:12px 14px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);font-size:16px}
.tip b{display:block;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--lamp);margin-bottom:3px}
.tip.game b{color:var(--muted)}
.tip .src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.next{margin-top:18px}

/* end */
.score{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;font-family:var(--display)}
.score b{font-size:84px;line-height:.9;font-weight:800;color:var(--lamp);font-variant-numeric:tabular-nums}
.score span{font-size:22px;color:var(--muted)}
.sec{margin-top:34px}
.sec h3{font-size:22px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:15px;background:var(--ink-2)}
.chip em{font-style:normal;color:var(--lamp);font-weight:700}
.miss{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.miss li{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ink-2)}
.miss strong{display:block}
.miss span{color:var(--muted);font-size:16px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.rate button{min-height:54px;border:1.5px solid var(--line);background:var(--ink-2);border-radius:12px;font:700 20px var(--display)}
.rate button:hover{border-color:var(--lamp)}
.rate button[aria-pressed=true]{background:var(--lamp);color:#1b1305;border-color:var(--lamp)}
.scale{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.yn{display:flex;gap:8px;margin:10px 0}
.yn button{flex:1;min-height:48px;border:1.5px solid var(--line);background:var(--ink-2);border-radius:12px;font-weight:700}
.yn button[aria-pressed=true]{background:var(--lamp);color:#1b1305;border-color:var(--lamp)}
textarea,input.share{width:100%;font:inherit;color:var(--text);background:var(--ink-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
label.q{display:block;font-weight:700;margin:18px 0 4px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
details.srcs{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
details.srcs summary{cursor:pointer;font-weight:700}
details.srcs ul{padding-left:18px;font-size:15px;color:var(--muted)}
.foot{margin-top:46px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.toast{color:var(--lamp-2);font-weight:700;margin-top:10px;min-height:1.4em}

#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
#blackout.on{animation:cut 1.5s linear forwards}
@keyframes cut{0%{opacity:0}6%{opacity:1}11%{opacity:.05}16%{opacity:1}22%{opacity:.35}27%{opacity:1}78%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .hero h1 .flick{animation:none}
  .bar i,.track i,.opt,.btn{transition:none}
  #blackout.on{animation:none}
}
@media (max-width:420px){
  body{font-size:17px}
  .meters{gap:8px 10px}
  .ml{font-size:11px}
  h2.st,.setup h2{font-size:29px}
  .when .t{font-size:34px}
}

/* v3: ajaeelarve ja poeskäik */
.budget{margin:18px 0 6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink-2)}
.budget .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.budget .row1 b{font:800 26px var(--display);color:var(--lamp);font-variant-numeric:tabular-nums}
.budget .tbar{height:8px;background:var(--ink-3);border-radius:4px;overflow:hidden;margin-top:8px}
.budget .tbar i{display:block;height:100%;background:var(--lamp);transition:width .5s}
.budget .tbar i.low{background:var(--ember)}
.secth{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
.secth h3{font-size:21px}
.secth span{font-size:14px;color:var(--muted)}
.mins{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font:700 12px var(--body);color:var(--lamp-2);vertical-align:2px;font-variant-numeric:tabular-nums}
.odds{display:inline-block;margin-left:8px;font:700 12px var(--body);color:var(--muted)}
.odds.lo{color:var(--ember)}
.pick .warn{display:block;color:var(--ember);font-size:14px;margin-top:4px}
.pick .ok{display:block;color:var(--lamp-2);font-size:14px;margin-top:4px}
.shopres{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.shopres li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line)}
.shopres .st{flex:none;width:96px;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase}
.shopres .st.ok{color:var(--lamp)} .shopres .st.out{color:var(--ember)} .shopres .st.late{color:var(--muted)}
.shopnote{color:var(--muted);font-size:16px;margin:10px 0}

/* v4: kodu ristlõige ja hilinenud tagajärjed */
figure.house{margin:16px 0 0}
figure.house svg{display:block;width:100%;height:auto;max-height:240px}
@keyframes rain{from{transform:translate(0,-10px)}to{transform:translate(-4px,10px)}}
.rain{animation:rain .6s linear infinite}
@keyframes flick2{0%,100%{opacity:1}40%{opacity:.7}60%{opacity:.9}}
.flame{animation:flick2 1.2s ease-in-out infinite}
.echo{margin:4px 0 16px;padding:12px 14px;border-radius:10px;border:1px dashed var(--lamp);background:rgba(255,179,71,.06)}
.echo b{display:block;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--lamp);margin-bottom:4px}
.echo p{margin:0 0 6px;font-size:16px}
.echo p:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){.rain,.flame{animation:none}}
.echo.crisis{border:1.5px solid var(--ember);background:rgba(255,123,95,.08)}
.echo.crisis b{color:var(--ember)}
</style>
</head>
<body>
<div id="blackout" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <span class="brand">Vool ära!</span>
    <span class="fam" id="famline"></span>
  </header>
  <div class="hud" id="hud" hidden></div>
  <main id="main" tabindex="-1"></main>
  <noscript><p>See mäng vajab JavaScripti.</p></noscript>
  <footer class="foot" id="foot">Iseseisev mänguprojekt. Ei ole riiklik juhis ega seotud Naiskodukaitse, Päästeameti ega Ole valmis! äpi arendajatega. Stsenaarium ja tegelased on väljamõeldud. Nõuanded põhinevad avalikel juhistel, allikas on märgitud iga nõuande juures. Hädaolukorras helista 112, riigiinfo telefon 1247.</footer>
</div>

<script>
(function(){
'use strict';

/* ===== Seaded: muuda enne avaldamist ===== */
const CONFIG = {
  shareUrl:'https://lemonadestand.ee/vool-ara/',
  feedbackEndpoint:'',         // valikuline: URL, mis võtab vastu JSON POST-i anonüümse tagasisidega
  appUrl:'https://www.olevalmis.ee/',
  guideUrl:'https://www.olevalmis.ee/kodused-varud',
  stockUrl:null,
  ctas:{share:true, again:true, app:true, stock:false}
};

const FAST = /[?&]fast=1/.test(location.search);

const METERS = ['warmth','water','food','info','power','mood'];
const BASE = {warmth:70, water:30, food:35, info:20, power:45, mood:70};
const TOTAL_H = 62;
const BUDGET = 90, PREP_START = 16*60 + 40;         // 16:40, torm 18:12
const SHOP_BASE = 45, SHOP_PER_ITEM = 5, SHOP_QUEUE_MAX = 30;

const ML = {warmth:'Soojus', water:'Vesi', food:'Toit', info:'Info', power:'Aku', mood:'Meeleolu'};
const ICON = {
  warmth:'<path d="M12 3c1 3.5 5 5.2 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.2 1.4.9 2.2 1.8 2.6C10.2 8.8 10.6 5.7 12 3z"/>',
  water:'<path d="M12 3.5C9 8 6.5 11 6.5 14.2a5.5 5.5 0 0 0 11 0C17.5 11 15 8 12 3.5z"/>',
  food:'<path d="M6 7c0-1.1 2.7-2 6-2s6 .9 6 2v10c0 1.1-2.7 2-6 2s-6-.9-6-2V7z"/><path d="M6 7c0 1.1 2.7 2 6 2s6-.9 6-2M6 12c0 1.1 2.7 2 6 2s6-.9 6-2"/>',
  info:'<path d="M6 17a8 8 0 0 1 0-10M9 14.5a4 4 0 0 1 0-5M18 7a8 8 0 0 1 0 10M15 9.5a4 4 0 0 1 0 5"/><circle cx="12" cy="12" r="1"/>',
  power:'<rect x="3" y="8" width="16" height="8" rx="2"/><path d="M21 11v2"/>',
  mood:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'
};

/* ===== Allikad ===== */
const SRC = {
  ov_el:{lab:'Ametlik juhis', name:'olevalmis.ee: Elektrikatkestus', url:'https://www.olevalmis.ee/elektrikatkestus'},
  ov_kute:{lab:'Ametlik juhis', name:'olevalmis.ee: Küttekatkestus', url:'https://www.olevalmis.ee/kuttekatkestus'},
  ov_vesi:{lab:'Ametlik juhis', name:'olevalmis.ee: Veekatkestus', url:'https://www.olevalmis.ee/veekatkestus'},
  ov_varud:{lab:'Ametlik juhis', name:'olevalmis.ee: Kodused varud', url:'https://www.olevalmis.ee/kodused-varud'},
  ov_nr:{lab:'Ametlik juhis', name:'olevalmis.ee: Abinumbrid', url:'https://www.olevalmis.ee/abinumbrid'},

function stormDates(now){
  const nextFri = x => { x = new Date(x); while(x.getDay() !== 5) x.setDate(x.getDate() + 1); return x; };
  let d = nextFri(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  // soojal ajal (ka siis, kui järgmine reede jääb juba maisse) toimub lugu novembris
  if(!MO[d.getMonth()]) d = nextFri(new Date(d.getMonth() > 10 ? d.getFullYear() + 1 : d.getFullYear(), 10, 10));
  const out = [];
  for(let i = 0; i < 4; i++){ const x = new Date(d); x.setDate(d.getDate() + i); out.push(x); }
  return {list:out, mo:MO[out[0].getMonth()]};
}

const clamp = v => Math.max(0, Math.min(100, v));
function ctx(st){
  const f = st.fam, kids = f.baby + f.small + f.school + f.teen;
  const H = HOMES[st.home] || HOMES.paneel;
  const heat = H.fireOk ? st.heat : 'ei';

}
const freshPrep = () => ({done:{}, list:[], shop:null, batt:null});
const kidMult = st => Math.min(1.5, 1 + .2 * (st.fam.small + st.fam.baby));
const taskMin = (st, id) => Math.round(ITEM[id].min * kidMult(st) / 5) * 5;
function usedMin(st){
  let u = 0;
  for(const id in st.prep.done) if(st.prep.done[id]) u += taskMin(st, id);
  if(st.prep.shop) u += st.prep.shop.took;
  return u;
}
const shopGot = (pr, id) => !!(pr.shop && pr.shop.res.some(r => r.id === id && r.st === 'ok'));
function computePicks(st){
  const c = ctx(st), pr = st.prep, out = [];
  visibleItems(c).forEach(it => {
    if(it.where === 'home'){
      if(!pr.done[it.id]) return;
      if(it.id === 'light' && !(pr.batt || shopGot(pr, 'batt'))) return;
      out.push(it.id);
    } else if(it.id !== 'batt' && shopGot(pr, it.id)) out.push(it.id);
  });
  return out;
}
function doShop(st, rnd){
  rnd = rnd || Math.random;
  const c = ctx(st), vis = visibleItems(c).map(i => i.id);
  const list = st.prep.list.filter(id => vis.includes(id));
  const remaining = BUDGET - usedMin(st);
  const queue = Math.round(rnd() * SHOP_QUEUE_MAX / 5) * 5;
  let t = SHOP_BASE + queue;
  const res = list.map(id => {
    t += SHOP_PER_ITEM;
    if(t > remaining) return {id, st:'late'};
    return {id, st:rnd() < ITEM[id].p ? 'ok' : 'out'};
  });
  st.prep.shop = {queue, res, took:Math.min(t, remaining)};
}
function startMeters(picks){
  const m = Object.assign({}, BASE);
  picks.forEach(id => { const fx = ITEM[id].fx; for(const k in fx) m[k] = clamp(m[k] + fx[k]); });
  return m;
}
function addFx(m, fx){
  const d = {};
  for(const k in fx){ const b = m[k]; m[k] = clamp(m[k] + Math.round(fx[k])); d[k] = m[k] - b; }
  return d;
}
function sceneDrift(sc, st){
  const c = ctx(st), d = Object.assign({}, sc.drift || {});
  const f = Math.max(.5, Math.min(1.75, c.people / 4));
  if(d.water < 0) d.water *= f * c.H.waterMul;
  if(d.food < 0) d.food *= f;
  if(d.warmth < 0) d.warmth *= c.heat === 'ahi' ? .5 : c.heat === 'kamin' ? .7 : c.H.warmMul;
  if(Object.keys(d).length){
    if(c.f.small) d.mood = (d.mood || 0) - 2;
    if(c.f.baby && !st.picks.includes('baby')) d.mood = (d.mood || 0) - 3;
  }
  return d;
}
const visibleOpts = (sc, c) => sc.opts.filter(o => !o.show || o.show(c));
function modOk(md, st, c){
  if(md.show && !md.show(c)) return false;
  if(md.has && !st.picks.includes(md.has)) return false;
  if(md.not && st.picks.includes(md.not)) return false;
  if(md.test && !md.test(st, c)) return false;
  return true;
}
const bump = (o, k) => { o[k] = (o[k] || 0) + 1; };
function resolve(st, sc, optId){
  const c = ctx(st), opts = visibleOpts(sc, c);
  const opt = opts.find(o => o.id === optId);
  const total = {}, lines = [];
  const add = fx => { for(const k in fx) total[k] = (total[k] || 0) + fx[k]; };
  add(V(opt.fx, c) || {});
  if(opt.req) bump(st.used, opt.req);
  opts.forEach(o => { if(o.req && !st.picks.includes(o.req)) bump(st.missed, o.req); });
  [].concat(opt.mods || [], sc.mods || []).forEach(md => {
    if(!modOk(md, st, c)) return;
    const fx = V(md.fx, c) || {};
    add(fx);
    if(md.text) lines.push({text:V(md.text, c), fx});
    if(md.has) bump(st.used, md.has);
    if(md.not) bump(st.missed, md.not);
  });
  st.comm += opt.comm || 0;
  const deltas = addFx(st.m, total);
  st.log.push(optId);
  st.hist.push(METERS.reduce((a, k) => a + st.m[k], 0) / METERS.length);
  return {optId, lines, deltas};
}
function rawScore(st){
  const h = st.hist.length ? st.hist : [METERS.reduce((a, k) => a + st.m[k], 0) / METERS.length];
  return h.reduce((a, b) => a + b, 0) / h.length * .85 + Math.min(3, st.comm) * 5 - (st.crises || 0) * 2;
}

  /* termomeeter */
  const th = Math.max(2, Math.min(26, (tempC - 5) / 16 * 26));
  out.push(`<rect x="${X + 46}" y="${Y + 14}" width="6" height="30" rx="3" fill="#0c111f" stroke="#59607a"/><rect x="${X + 47.5}" y="${Y + 42 - th}" width="3" height="${th}" fill="${tempC < 12 ? '#7fb2ff' : '#ff7b5f'}"/>`);
  out.push(`<text x="${X + 56}" y="${Y + 30}" font-size="11" font-weight="700" fill="#f3ebd9" font-family="Atkinson Hyperlegible, sans-serif">${tempC}°</text>`);
  /* riiul: toit, raadio, küünlad */
  const shX = X + 88, shY = Y + 14;
  out.push(`<rect x="${shX}" y="${shY}" width="34" height="28" rx="2" fill="#2b2230" stroke="#59607a"/><line x1="${shX}" y1="${shY + 14}" x2="${shX + 34}" y2="${shY + 14}" stroke="#59607a"/>`);
  const tins = Math.round(m.food / 100 * 8);
  for(let i = 0; i < tins; i++) out.push(`<rect x="${shX + 3 + (i % 4) * 8}" y="${shY + (i < 4 ? 17 : 3)}" width="6" height="9" rx="1" fill="#c9a24a"/>`);
  if(has('radio')) out.push(`<rect x="${shX + 2}" y="${shY - 9}" width="14" height="9" rx="1.5" fill="#8a94b4"/><line x1="${shX + 13}" y1="${shY - 9}" x2="${shX + 18}" y2="${shY - 17}" stroke="#8a94b4"/>`);
  if(candles) out.push(`<rect x="${shX + 22}" y="${shY - 8}" width="3" height="8" fill="#eee"/><rect x="${shX + 28}" y="${shY - 8}" width="3" height="8" fill="#eee"/><ellipse class="flame" cx="${shX + 23.5}" cy="${shY - 10}" rx="1.6" ry="2.6" fill="#ffb347"/><ellipse class="flame" cx="${shX + 29.5}" cy="${shY - 10}" rx="1.6" ry="2.6" fill="#ffb347"/>`);
  /* ahi või kamin */
  if(c.fire){
    const fx = X + 92, fw = c.heat === 'ahi' ? 30 : 26, fh = c.heat === 'ahi' ? 52 : 34;
    out.push(`<rect x="${fx}" y="${FL - fh}" width="${fw}" height="${fh}" rx="2" fill="#8a4a36"/><rect x="${fx + 7}" y="${FL - 18}" width="${fw - 14}" height="12" rx="1" fill="#1b1305"/>`);
    if(fireOn) out.push(`<path class="flame" d="M${fx + fw / 2} ${FL - 17} q5 6 0 10 q-5 -4 0 -10z" fill="#ffb347"/>`);
  }
  /* aku */
  const bw = Math.round(m.power / 100 * 20);
  out.push(`<rect x="${X + 150}" y="${Y + 12}" width="24" height="11" rx="2" fill="none" stroke="#a8b4d2"/><rect x="${X + 174}" y="${Y + 15}" width="2.5" height="5" fill="#a8b4d2"/><rect x="${X + 152}" y="${Y + 14}" width="${bw}" height="7" fill="${m.power < 25 ? '#ff7b5f' : '#ffb347'}"/>`);
  /* vannituba: vann ja veetase */
  const bx = X + 132;
  out.push(`<line x1="${bx - 4}" y1="${Y + 32}" x2="${bx - 4}" y2="${FL}" stroke="#2b3659" stroke-width="3"/>`);
  const wl = Math.round(m.water / 100 * 16);
  out.push(`<rect x="${bx + 2}" y="${FL - 24}" width="46" height="20" rx="6" fill="#d7dcea"/><rect x="${bx + 5}" y="${FL - 7 - wl}" width="40" height="${wl}" rx="3" fill="#6fa8e8"/>`);
  out.push(`<path d="M${bx + 40} ${FL - 24} v-14 h-8" stroke="#a8b4d2" stroke-width="2" fill="none"/>`);
  /* pere */
  const people = [];
  for(let i = 0; i < c.f.adults; i++) people.push([34, '#c47b5a']);
  for(let i = 0; i < c.f.teen; i++) people.push([30, '#5a8f7b']);
  for(let i = 0; i < c.f.school; i++) people.push([24, '#7b6bb0']);
  for(let i = 0; i < c.f.small; i++) people.push([18, '#d0a040']);
  for(let i = 0; i < c.f.baby; i++) people.push([11, '#e7b8a0']);
  const n = people.length, span = Math.min(70, n * 12), x0 = X + 50 - span / 2 + 6;
  people.forEach(([h, col], i) => {
    const px = x0 + (n > 1 ? i * span / (n - 1) : span / 2), top = FL - 6 - h;
    out.push(`<rect x="${px - 4}" y="${top + h * .32}" width="8" height="${h * .68}" rx="3" fill="${col}"/><circle cx="${px}" cy="${top + h * .18}" r="${Math.max(2.5, h * .14)}" fill="#e8c9a8"/>`);
  });
  if(blanket) out.push(`<path d="M${x0 - 10} ${FL - 6} Q${x0 + span / 2} ${FL - 40} ${x0 + span + 10} ${FL - 6}z" fill="#5b4a8a" opacity=".9"/>`);
  if(c.f.dog) out.push(`<ellipse cx="${X + 26}" cy="${FL - 7}" rx="9" ry="4.5" fill="#8a6a4a"/><circle cx="${X + 18}" cy="${FL - 11}" r="3.5" fill="#8a6a4a"/>`);
  if(c.f.cat) out.push(`<ellipse cx="${X + 82}" cy="${FL - 6}" rx="5" ry="3" fill="#a8a8b8"/><circle cx="${X + 86}" cy="${FL - 9}" r="2.4" fill="#a8a8b8"/>`);
  if(!lit && !grid) out.push(`<rect x="${X}" y="${Y}" width="${IW}" height="${IH}" rx="6" fill="#000" opacity=".35"/>`);
  out.push('</g>');

  const alt = `${c.H.n}. Toas ${tempC} kraadi, ${grid ? 'tuled põlevad' : lit ? 'valgust annab ' + (fireOn ? 'tuli koldes' : torch ? 'taskulamp' : 'küünal') : 'pime'}.`;
  return `<figure class="house"><svg viewBox="0 0 360 190" role="img" aria-label="${esc(alt)}">${out.join('')}</svg></figure>`;
}

function buildHud(){
  $('#hud').innerHTML = `<div class="meters">${METERS.map(k =>
    `<div class="m" data-k="${k}" role="img"><div class="ml"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span>${ML[k]}</span></div><div class="bar"><i></i></div></div>`).join('')}</div>
    <div class="clock"><span id="clk"></span><div class="track" aria-hidden="true"><i id="trk"></i>${SC.map(s => `<b style="left:${(s.hour / TOTAL_H * 100).toFixed(1)}%" data-h="${s.hour}"></b>`).join('')}</div></div>`;
}
function updateHud(){
  const h = $('#hud');
  const show = ['prep','scene','end'].includes(S.screen);
  h.hidden = !show;
  $('#famline').textContent = S.screen === 'title' || S.screen === 'setup' ? '' : famSummary(ctx(S));
  if(!show) return;
  if(!h.firstChild) buildHud();
  const mm = S.screen === 'prep' ? startMeters(computePicks(S)) : S.m;
  METERS.forEach(k => {
    const el = h.querySelector(`.m[data-k="${k}"]`);
    el.querySelector('i').style.width = mm[k] + '%';
    el.classList.toggle('low', mm[k] < 25);
    el.setAttribute('aria-label', `${ML[k]} ${mm[k]}/100`);
  });
  let hour = 0, label = 'Enne tormi';
  if(S.screen === 'prep'){ const rem = BUDGET - usedMin(S); label = `Aega tormini ${rem} min${S.prep.shop ? '' : ' · poes käimata'}`; }
  if(S.screen === 'scene'){ hour = SC[S.i].hour; label = `Pimedas ${hour} h`; }
  if(S.screen === 'end'){ hour = TOTAL_H; label = `Pimedas ${TOTAL_H} h`; }
  $('#clk').textContent = label;
  $('#trk').style.width = (hour / TOTAL_H * 100) + '%';
  h.querySelectorAll('.track b').forEach(b => b.classList.toggle('on', +b.dataset.h <= hour && S.screen !== 'prep'));
  document.documentElement.style.setProperty('--glow', (S.screen === 'prep' ? .55 : .15 + mm.power / 100 * .55).toFixed(2));
}

function render(){
  $('#main').innerHTML = S.screen === 'title' ? viewTitle()
    : S.screen === 'setup' ? viewSetup()
    : S.screen === 'prep' ? viewPrep()
    : S.screen === 'scene' ? viewScene()
    : viewEnd();
  updateHud();
  try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => JSON.parse(JSON.stringify(S))); }catch(e){}
}
function focusHeading(){ const h = $('#h'); if(h) h.focus({preventScroll:true}); window.scrollTo(0, 0); }
function keep(fn){ const y = window.scrollY; fn(); render(); window.scrollTo(0, y); }
function enterScene(i){
  S.i = i; S.res = null; S.screen = 'scene';
  const e = sceneEntry(S, i);
  S.echo = e.echo; S.crisis = e.crisis;
  S.crises = (S.crises || 0) + e.crisis.length;
  S.drift = addFx(S.m, e.d);
}
function refocus(sel){ const b = document.querySelector(sel); if(b) b.focus({preventScroll:true}); }

/* ===== Tegevused ===== */
const A = {
  start(){ S.screen = 'setup'; render(); focusHeading(); },
  inc(d){ keep(() => { const row = STEP_ROWS.find(r => r[0] === d.k); S.fam[d.k] = Math.max(row[3], Math.min(row[4], S.fam[d.k] + (+d.d))); saveSetup(); }); refocus(`[data-a="inc"][data-k="${d.k}"][data-d="${d.d}"]`); },
  pet(d){ keep(() => { S.fam[d.k] = !S.fam[d.k]; saveSetup(); }); refocus(`[data-a="pet"][data-k="${d.k}"]`); },
  home(d){ keep(() => { S.home = d.v; saveSetup(); }); refocus(`[data-a="home"][data-v="${d.v}"]`); },
  heat(d){ keep(() => { S.heat = d.v; saveSetup(); }); refocus(`[data-a="heat"][data-v="${d.v}"]`); },
  toSetup(){ S.screen = 'setup'; S.res = null; render(); focusHeading(); },
  toPrep(){ S.screen = 'prep'; render(); focusHeading(); },
  task(d){
    keep(() => { S.confirm = false;
      const pr = S.prep;
      if(pr.done[d.id]) pr.done[d.id] = false;
      else if(taskMin(S, d.id) <= BUDGET - usedMin(S)){
        pr.done[d.id] = true;
        if(d.id === 'light' && pr.batt === null) pr.batt = Math.random() < .5;
      }
    });
    refocus(`[data-a="task"][data-id="${d.id}"]`);
  },
  slist(d){
    if(S.prep.shop) return;
    keep(() => { S.confirm = false; const l = S.prep.list, i = l.indexOf(d.id); if(i >= 0) l.splice(i, 1); else l.push(d.id); });
    refocus(`[data-a="slist"][data-id="${d.id}"]`);
  },
  goShop(){ if(S.prep.shop || !S.prep.list.length) return; keep(() => { S.confirm = false; doShop(S); }); },
  begin(){
    const rem = BUDGET - usedMin(S);
    if(!S.confirm && (!S.prep.shop || rem >= 10)){
      S.confirm = true; keep(() => {});
      const w = $('#confirm'); if(w) w.scrollIntoView({block:'center', behavior:REDUCED ? 'auto' : 'smooth'});
      return;
    }
    S.confirm = false;
    beginRun(S);
    S.fun = null; S.again = null; S.note = ''; S.fb = ''; S.shareMsg = ''; S.shareFallback = '';
    const go = () => { enterScene(0); render(); focusHeading(); };
    if(FAST || REDUCED){ go(); return; }
    const o = $('#blackout'); o.className = 'on';
    setTimeout(go, 700); setTimeout(() => { o.className = ''; }, 1500);
  },
  pick(d){
    if(S.res) return;
    const sc = SC[S.i], o = visibleOpts(sc, ctx(S)).find(x => x.id === d.id);
    if(!o || (o.req && !S.picks.includes(o.req))) return;
    S.res = resolve(S, sc, d.id);
    render();
    const nx = $('#nx'); if(nx){ nx.focus({preventScroll:true}); nx.scrollIntoView({block:'nearest', behavior:REDUCED ? 'auto' : 'smooth'}); }
  },
  next(){
    if(S.i < SC.length - 1){ enterScene(S.i + 1); render(); focusHeading(); }
    else { S.screen = 'end'; S.res = null; render(); focusHeading(); }
  },
  rate(d){ keepNote(); keep(() => { S.fun = +d.n; }); },
  again2(d){ keepNote(); keep(() => { S.again = +d.v; }); },
  send(){
    keepNote();
    const score = finalScore(S), c = ctx(S);
    const payload = {v:3, t:Date.now(), fam:S.fam, home:S.home, heat:c.heat, prep:{done:S.prep.done, shop:S.prep.shop}, picks:S.picks, choices:S.log, score,
                     fun:S.fun, again:S.again, note:S.note.slice(0, 300)};
    try{ const all = JSON.parse(localStorage.getItem('vool-fb') || '[]'); all.push(payload); localStorage.setItem('vool-fb', JSON.stringify(all)); }catch(e){}
    if(CONFIG.feedbackEndpoint){
      try{ fetch(CONFIG.feedbackEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true}).catch(() => {}); }catch(e){}
      S.fb = 'Aitäh! Vastus saadetud.';
    } else S.fb = 'Aitäh! Vastus jäi ainult sinu brauserisse (testversioon).';
    keep(() => {});
  },
  again(){ S.prep = freshPrep(); S.picks = []; S.res = null; S.screen = 'prep'; render(); focusHeading(); },
  async share(){
    keepNote();
    const score = finalScore(S), tier = tierOf(score);
    const url = CONFIG.shareUrl || location.href.split('#')[0];
    const text = `Elasin mängus Vool ära! üle 62 tundi pimedust ja sain tiitli „${tier.t}“ (${score}/100). Proovi ise oma perega:`;
    try{ if(navigator.share){ await navigator.share({title:'Vool ära!', text, url}); return; } }
    catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(text + ' ' + url); S.shareMsg = 'Tekst kopeeritud. Kleebi see sõbrale.'; S.shareFallback = ''; }
    catch(e){ S.shareMsg = 'Kopeeri see tekst käsitsi:'; S.shareFallback = text + ' ' + url; }
    keep(() => {});
    const sh = $('#sh'); if(sh){ sh.focus(); sh.select(); }
  }
};
function keepNote(){ const n = $('#note'); if(n) S.note = n.value; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(!b || b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  const fn = A[b.dataset.a]; if(fn) fn(b.dataset);
});
document.addEventListener('keydown', e => {
  if(S.screen === 'scene' && !S.res && /^[1-9]$/.test(e.key) && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')){
    const o = visibleOpts(SC[S.i], ctx(S))[+e.key - 1];
    if(o && !(o.req && !S.picks.includes(o.req))) A.pick({id:o.id});
  }
});

function boot(d){
  S = (d && d.screen && d.fam && d.prep && HOMES[d.home]) ? Object.assign(fresh(), d) : fresh();
  render();
}
window.__vool = {get state(){ return S; }, set state(v){ S = v; }, SC, ITEMS, HOMES, ctx, visibleOpts, visibleItems, resolve, sceneDrift, startMeters, addFx,
  rawScore, finalScore, tierOf, A, fresh, freshPrep, doShop, computePicks, usedMin, taskMin, beginRun, sceneEntry, houseSvg, BUDGET, DATES};
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
